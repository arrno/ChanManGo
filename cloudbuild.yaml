steps:
    # Build the container image and tag for Artifact Registry
    - name: "gcr.io/cloud-builders/docker"
      args:
          [
              "build",
              "-t",
              "us-docker.pkg.dev/multicast-458021/chanban/chanban:latest",
              ".",
          ]

    # Push the image to Artifact Registry
    - name: "gcr.io/cloud-builders/docker"
      args:
          ["push", "us-docker.pkg.dev/multicast-458021/chanban/chanban:latest"]

    # Deploy to Cloud Run
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      entrypoint: gcloud
      args:
          - run
          - deploy
          - chanban
          - --image=us-docker.pkg.dev/multicast-458021/chanban/chanban:latest
          - --region=us-east4
          - --platform=managed
          - --allow-unauthenticated
          - --add-cloudsql-instances=multicast-458021:us-east4:chanban-db
          - --set-env-vars=DB_USER=postgres,DB_PASSWORD=[password],DB_DATASTORE=postgres,DB_HOST=/cloudsql/multicast-458021:us-east4:chanban-db,DB_PORT=5432,LOCAL_SECRET=[secret],WEB_PORT=8080
          - --project=multicast-458021

images:
    - "us-docker.pkg.dev/multicast-458021/chanban/chanban:latest"
